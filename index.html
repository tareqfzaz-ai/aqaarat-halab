<script>

const SUPABASE_URL = "https://kypzypsonkzfrhpldtmp.supabase.co";
const SUPABASE_KEY = "sb_publishable_9QRajsRSbCM2ee5nEphoAg_xmRUQR2-";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let properties = [];
const importedPropertyDefault = {
  id: "whatsapp-1539",
  title: "شقة للبيع سوبر ديلوكس - سيف الدولة",
  type: "شقة", area: "سيف الدولة", price: "75,000 دولار + بازار", size: "120 م²",
  phone: "0957839713", image: "",
  description: "العملية: بيع\nالعنوان: سيف الدولة - مفرق شماسي - قريب سنتر الفهد\nالغرف: 4 غرف محررات\nالطابق: الثاني أمامي\nالمميزات: قبلي شمالي • سوبر ديلوكس • 8 ألواح طاقة شمسية + بطارية ليثيوم • خزان 2000 لتر على السطح • جاهز للسكن\nصاحب الإعلان: مكتب الظاظا للخدمات العقارية في حلب وسوريا"
};
let importedProperty = JSON.parse(localStorage.getItem("aqaarat_imported_property") || "null") || importedPropertyDefault;

let editingId = null;
const areaCoords = {"سيف الدولة":[36.1967,37.1438],"الأعظمية":[36.1918,37.1455],"الحمدانية":[36.165,37.115],"الجميلية":[36.205,37.157],"الزهراء":[36.232,37.166],"الفرقان":[36.218,37.145],"الموكامبو":[36.218,37.174],"الشهباء":[36.24,37.18],"ريف حلب":[36.25,37.1]};
const map=L.map("map").setView([36.2021,37.1343],12); L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap"}).addTo(map); let markers=[];


function openForm() {

  const form = document.getElementById("formBox");

  form.style.display =
    form.style.display === "block"
      ? "none"
      : "block";

  form.scrollIntoView({
    behavior: "smooth"
  });
}


/* تحميل الإعلانات المحفوظة */

async function loadProperties() {

  const { data, error } =
    await supabaseClient
      .from("properties")
      .select("*")
      .order("created_at", {
        ascending: false
      });

  if (error) {

    console.error(error);

    alert("حدث خطأ أثناء تحميل الإعلانات");

    return;
  }

  const hiddenImported = localStorage.getItem("aqaarat_imported_deleted") === "1";
  properties = hiddenImported ? (data || []) : [importedProperty, ...(data || []).filter(p => p.id !== importedProperty.id)];

  displayProperties(properties); drawMarkers(properties);
}


/* إضافة إعلان */

async function addProperty() {
  const title = document.getElementById("title").value.trim();
  const purpose = document.getElementById("purpose").value;
  const type = document.getElementById("type").value;
  const area = document.getElementById("area").value;
  const address = document.getElementById("address").value.trim();
  const price = document.getElementById("price").value.trim();
  const size = document.getElementById("size").value.trim();
  const rooms = document.getElementById("rooms").value.trim();
  const bathrooms = document.getElementById("bathrooms").value.trim();
  const floor = document.getElementById("floor").value.trim();
  const year = document.getElementById("year").value.trim();
  const furnished = document.getElementById("furnished").value;
  const features = document.getElementById("features").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const contactName = document.getElementById("contactName").value.trim();
  const description = document.getElementById("description").value.trim();
  const video = document.getElementById("video").value.trim();
  const imageInput = document.getElementById("image");

  if (!title || !purpose || !type || !area || !price || !phone) {
    alert("يرجى تعبئة الحقول الأساسية: العملية، نوع العقار، العنوان، السعر ورقم التواصل.");
    return;
  }

  const details = [
    purpose && "العملية: " + purpose,
    address && "العنوان: " + address,
    rooms && "الغرف: " + rooms,
    bathrooms && "الحمامات: " + bathrooms,
    floor && "الطابق: " + floor,
    year && "سنة/عمر البناء: " + year,
    furnished && "التجهيز: " + furnished,
    features && "المميزات: " + features,
    contactName && "صاحب الإعلان: " + contactName,
    video && "فيديو: " + video
  ].filter(Boolean).join("\n");

  const fullDescription = details + (description ? "\nالوصف: " + description : "");

  if (imageInput.files.length > 0) {
    const reader = new FileReader();
    reader.onload = async function(event) {
      await createProperty(event.target.result, title, type, area, price, size, phone, fullDescription);
    };
    reader.readAsDataURL(imageInput.files[0]);
  } else {
    await createProperty("", title, type, area, price, size, phone, fullDescription);
  }
}

async function createProperty(image, title, type, area, price, size, phone, description) {
  let result;
  if (editingId === importedProperty.id) {
    const old = properties.find(p => p.id === editingId) || importedProperty;
    importedProperty = Object.assign({}, old, {title,type,area,price,size,phone,description,image:image || old?.image || ""});
    localStorage.setItem("aqaarat_imported_property", JSON.stringify(importedProperty));
    result = {data: importedProperty, error: null};
  } else if (editingId) {
    const old = properties.find(p => p.id === editingId);
    result = await supabaseClient.from("properties")
      .update({title,type,area,price,size,phone,description,image:image || old?.image || ""})
      .eq("id",editingId).select().single();
  } else {
    result = await supabaseClient.from("properties")
      .insert([{title,type,area,price,size,phone,description,image}]).select().single();
  }

  const data=result.data, error=result.error;
  if (error) {
    console.error(error);
    alert("ما قدرنا نحفظ الإعلان. تأكد من الاتصال بالإنترنت.");
    return;
  }

  const wasEditing = !!editingId;
  if(wasEditing){
    properties=properties.map(p=>p.id===editingId?data:p);
    editingId=null;
  } else {
    properties.unshift(data);
  }

  displayProperties(properties);
  drawMarkers(properties);
  clearForm();
  document.getElementById("formBox").style.display="none";
  document.getElementById("formTitle").textContent="إضافة إعلان عقاري";
  document.getElementById("publishBtn").textContent="نشر الإعلان";
  alert(wasEditing ? "تم تعديل الإعلان بنجاح ✅" : "تم نشر الإعلان بنجاح ✅");
}


/* عرض الإعلانات */

function clearForm(){
  ["title","address","price","size","rooms","bathrooms","floor","year","features","phone","contactName","description","video"].forEach(id=>document.getElementById(id).value="");
  ["purpose","type","area","furnished"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("image").value="";
}

window.editProperty = async function(id){
  if(id === importedProperty.id) localStorage.removeItem("aqaarat_imported_deleted");
  let p=properties.find(x=>String(x.id)===String(id));
  if(!p && id !== importedProperty.id){
    const {data,error}=await supabaseClient.from("properties").select("*").eq("id",id).maybeSingle();
    if(error){ console.error(error); alert("تعذر تحميل الإعلان للتعديل. حاول مرة ثانية."); return; }
    p=data;
  }
  if(!p){ alert("لم يتم العثور على الإعلان."); return; }
  editingId=id;
  document.getElementById("formBox").style.display="block";
  document.getElementById("formTitle").textContent="✏️ تعديل الإعلان";
  document.getElementById("publishBtn").textContent="حفظ التعديلات";
  document.getElementById("title").value=p.title||"";
  document.getElementById("type").value=p.type||"";
  document.getElementById("area").value=p.area||"";
  document.getElementById("price").value=p.price||"";
  document.getElementById("size").value=p.size||"";
  document.getElementById("phone").value=p.phone||"";
  const lines=String(p.description||"").split("\n");
  const get=(label)=>{const x=lines.find(v=>v.startsWith(label));return x?x.slice(label.length).trim():""};
  document.getElementById("purpose").value=get("العملية: ");
  document.getElementById("address").value=get("العنوان: ");
  document.getElementById("rooms").value=get("الغرف: ");
  document.getElementById("bathrooms").value=get("الحمامات: ");
  document.getElementById("floor").value=get("الطابق: ");
  document.getElementById("year").value=get("سنة/عمر البناء: ");
  document.getElementById("furnished").value=get("التجهيز: ");
  document.getElementById("features").value=get("المميزات: ");
  document.getElementById("contactName").value=get("صاحب الإعلان: ");
  document.getElementById("video").value=get("فيديو: ");
  document.getElementById("description").value=get("الوصف: ");
  document.getElementById("formBox").scrollIntoView({behavior:"smooth"});
}

window.deleteProperty = async function(id){
  if(!confirm("هل أنت متأكد من حذف هذا الإعلان؟"))return;
  if(id === importedProperty.id){
    localStorage.setItem("aqaarat_imported_deleted","1");
    properties=properties.filter(p=>p.id!==id);
    displayProperties(properties);
    drawMarkers(properties);
    alert("تم حذف الإعلان بنجاح ✅");
    return;
  }
  const {error}=await supabaseClient.from("properties").delete().eq("id",id);
  if(error){alert("تعذر حذف الإعلان. قد تكون صلاحية الحذف غير مفعلة.");return}
  properties=properties.filter(p=>p.id!==id);
  displayProperties(properties);
  drawMarkers(properties);
}

function drawMarkers(list){
  markers.forEach(m=>map.removeLayer(m)); markers=[];
  list.forEach(p=>{
    const pos=areaCoords[p.area];
    if(pos){
      const m=L.marker(pos).addTo(map).bindPopup("<b>"+String(p.title||"").replace(/</g,"&lt;")+"</b><br>📍 "+String(p.area||"").replace(/</g,"&lt;"));
      markers.push(m);
    }
  });
}

function displayProperties(list) {
  const container=document.getElementById("propertyList");
  if(!list.length){container.innerHTML='<div class="empty">لا توجد إعلانات مطابقة</div>';return;}
  container.innerHTML="";
  list.forEach(function(property){
    const card=document.createElement("div");
    card.className="card";
    let imageHTML=property.image
      ? '<img class="card-image" src="'+property.image+'" alt="صورة العقار" onclick="openImageModal(this.src)">'
      : '<div class="card-image" style="display:flex;align-items:center;justify-content:center;font-size:55px;">🏠</div>';

    // توحيد رقم الهاتف السوري بصيغة واتساب الدولية: 09xxxxxxxx -> 9639xxxxxxxx
    const rawPhone=String(property.phone||"").trim();
    const arabicDigits="٠١٢٣٤٥٦٧٨٩";
    let digits=rawPhone.replace(/[٠-٩]/g,d=>String(arabicDigits.indexOf(d))).replace(/[^0-9]/g,"");
    if(digits.startsWith("00")) digits=digits.slice(2);
    if(digits.startsWith("0")) digits="963"+digits.slice(1);
    else if(digits.startsWith("9") && digits.length===9) digits="963"+digits;
    else if(!digits.startsWith("963")) digits="963"+digits;
    const whatsappNumber=digits;
    const cleanPhone=digits;
    const desc=String(property.description||"");
    const lines=desc.split("\n").filter(Boolean);
    const purpose=lines.find(x=>x.startsWith("العملية: "))?.slice(9)||"";
    const address=lines.find(x=>x.startsWith("العنوان: "))?.slice(9)||"";
    const rooms=lines.find(x=>x.startsWith("الغرف: "))?.slice(7)||"";
    const bathrooms=lines.find(x=>x.startsWith("الحمامات: "))?.slice(10)||"";
    const floor=lines.find(x=>x.startsWith("الطابق: "))?.slice(8)||"";
    const furnished=lines.find(x=>x.startsWith("التجهيز: "))?.slice(9)||"";
    const features=lines.find(x=>x.startsWith("المميزات: "))?.slice(10)||"";
    const owner=lines.find(x=>x.startsWith("صاحب الإعلان: "))?.slice(14)||"";
    const video=lines.find(x=>x.startsWith("فيديو: "))?.slice(7)||"";
    const longDesc=lines.find(x=>x.startsWith("الوصف: "))?.slice(7)||"";

    const detailRows=[
      purpose&&"🔖 العملية: "+purpose,
      "🏷️ النوع: "+(property.type||""),
      "📍 المنطقة: "+(property.area||""),
      address&&"🧭 العنوان: "+address,
      "💰 السعر: "+(property.price||""),
      property.size&&"📐 المساحة: "+property.size,
      rooms&&"🛏️ الغرف: "+rooms,
      bathrooms&&"🚿 الحمامات: "+bathrooms,
      floor&&"🏢 الطابق: "+floor,
      furnished&&"🛋️ التجهيز: "+furnished,
      features&&"⭐ المميزات: "+features,
      owner&&"👤 صاحب الإعلان: "+owner
    ].filter(Boolean).map(x=>"<p>"+x+"</p>").join("");

    card.innerHTML=imageHTML+
      '<div class="card-content">'+
      '<h3>'+String(property.title||"عقار").replace(/</g,"&lt;")+'</h3>'+
      detailRows+
      (longDesc?'<p style="white-space:pre-line">📝 '+longDesc.replace(/</g,"&lt;")+'</p>':"")+
      '<div class="actions">'+
      '<a class="contact" href="tel:'+cleanPhone+'">📞 اتصال</a>'+
      '<a class="contact" href="https://wa.me/'+whatsappNumber+'?text='+encodeURIComponent("مرحباً، عم أتواصل معك من منصة عقارات حلب الظاظا بخصوص هذا العرض.\n\nالعقار: "+property.title+"\nالمنطقة: "+property.area+"\nالسعر: "+property.price+"\n\nرابط العرض:\n"+window.location.origin+window.location.pathname+"?property="+encodeURIComponent(String(property.id)))+'" target="_blank" rel="noopener noreferrer">📱 واتساب</a>'+
      (areaCoords[property.area]?'<a class="map-btn" href="https://www.google.com/maps/search/?api=1&query='+areaCoords[property.area][0]+','+areaCoords[property.area][1]+'" target="_blank">📍 فتح الخريطة</a>':"")+
      (video?'<a class="map-btn" href="'+video.replace(/"/g,"&quot;")+'" target="_blank">🎥 فيديو العقار</a>':"")+
      '<button type="button" class="edit-btn" data-action="edit" data-id="'+String(property.id).replace(/"/g,"&quot;")+'">✏️ تعديل</button>'+
      '<button type="button" class="delete-btn" data-action="delete" data-id="'+String(property.id).replace(/"/g,"&quot;")+'">🗑️ حذف</button>'+
      '</div></div>';
    container.appendChild(card);
  });
}


document.addEventListener("click",function(ev){
  const btn=ev.target.closest("[data-action]");
  if(!btn)return;
  const id=btn.getAttribute("data-id");
  if(btn.getAttribute("data-action")==="edit") window.editProperty(id);
  else if(btn.getAttribute("data-action")==="delete") window.deleteProperty(id);
});

/* البحث */

window.openImageModal = function(src){const modal=document.getElementById("imageModal");const img=document.getElementById("modalImage");if(!src)return;img.src=src;modal.style.display="flex";}
window.closeImageModal = function(){document.getElementById("imageModal").style.display="none";document.getElementById("modalImage").src="";}
window.searchProperties = function() {

  const text =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase();


  const type =
    document
      .getElementById("searchType")
      .value;


  const filtered =
    properties.filter(function(property) {

      const matchesText =

        String(property.title || "")
          .toLowerCase()
          .includes(text)

        ||

        String(property.area || "")
          .toLowerCase()
          .includes(text)
        ||
        String(property.description || "")
          .toLowerCase()
          .includes(text);


      const matchesType =
        !type ||
        property.type === type;


      return matchesText && matchesType;

    });


  displayProperties(filtered);

}

loadProperties();

  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(console.error);
  });
