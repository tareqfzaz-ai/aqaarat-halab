<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عقارات الظاظا</title>
  <meta property="og:image" content="https://tareqfzaz-ai.github.io/aqaarat-halab/cover.png">
  <meta property="og:title" content="عقارات الظاظا">
  <meta property="og:description" content="منصة عقارية للإعلانات في حلب">
  <meta property="og:type" content="website">
<meta property="og:url" content="https://tareqfzaz-ai.github.io/aqaarat-halab/">
<meta property="og:image:width" content="1000">
<meta property="og:image:height" content="563">
  <meta property="og:image:type" content="image/png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://tareqfzaz-ai.github.io/aqaarat-halab/cover.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: #d4af37;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      font-size: 34px;
      margin-bottom: 8px;
    }

    header p {
      color: white;
      font-size: 16px;
    }

    .add-section {
      text-align: center;
      padding: 20px;
      background: white;
    }

    .add-btn {
      background: #d4af37;
      color: #111;
      border: none;
      padding: 14px 28px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .form-box {
      display: none;
      max-width: 700px;
      margin: 20px auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 15px #ccc;
    }

    .form-box h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #b28b18;
    }

    .form-box input,
    .form-box select,
    .form-box textarea {
      width: 100%;
      padding: 13px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .form-box textarea {
      height: 100px;
      resize: vertical;
    }

    .publish-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    .search {
      background: white;
      padding: 20px;
      text-align: center;
      box-shadow: 0 2px 8px #ccc;
    }

    .search input,
    .search select {
      padding: 12px;
      margin: 5px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .search button {
      padding: 12px 25px;
      border: none;
      border-radius: 8px;
      background: #d4af37;
      font-weight: bold;
      cursor: pointer;
    }

    .container {
      max-width: 1100px;
      margin: 25px auto;
      padding: 15px;
    }

    .title {
      text-align: center;
      margin-bottom: 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 12px #ccc;
    }

    .card-image {
      width: 100%;
      height: 190px;
      object-fit: cover;
      background: #ddd;
    }

    .card-content {
      padding: 15px;
    }

    .card h3 {
      color: #b28b18;
      margin-bottom: 10px;
    }

    .card p {
      margin: 7px 0;
    }

    .contact {
      display: block;
      margin-top: 15px;
      text-align: center;
      padding: 11px;
      background: #111;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    footer {
      margin-top: 40px;
      background: #111;
      color: white;
      text-align: center;
      padding: 25px;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #777;
    }
  </style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>#map{height:330px;max-width:1100px;margin:20px auto;border-radius:15px;box-shadow:0 3px 12px #ccc}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.map-btn,.edit-btn,.delete-btn{display:block;text-align:center;padding:10px;border:0;border-radius:8px;text-decoration:none;font-weight:bold}.map-btn{background:#eee;color:#222}.edit-btn{background:#d4af37;color:#111}.delete-btn{background:#f1d4d4;color:#9b111e}</style>
</head>

<body>

<header>
  <h1>🏠 عقارات الظاظا</h1>
  <p>منصة عقارية للإعلانات في حلب</p>
</header>

<div class="add-section">
  <button class="add-btn" onclick="openForm()">
    ➕ إضافة إعلان
  </button>
</div>

<div class="form-box" id="formBox">

  <h2>إضافة إعلان عقاري</h2>

  <input id="title" type="text" placeholder="عنوان العقار">

  <select id="type">
    <option value="">نوع العقار</option>
    <option>منزل</option>
    <option>شقة</option>
    <option>أرض</option>
    <option>مزرعة</option>
    <option>محل</option>
    <option>مكتب</option>
  </select>

  <select id="area">
    <option value="">المنطقة</option>
    <option>سيف الدولة</option>
    <option>الأعظمية</option>
    <option>الحمدانية</option>
    <option>الجميلية</option>
    <option>الزهراء</option>
    <option>الفرقان</option>
    <option>الموكامبو</option>
    <option>الشهباء</option>
    <option>ريف حلب</option>
    <option>منطقة أخرى</option>
  </select>

  <input id="price" type="text" placeholder="السعر">

  <input id="size" type="text" placeholder="المساحة بالمتر">

  <input id="phone" type="text" placeholder="رقم التواصل">

  <textarea id="description" placeholder="اكتب تفاصيل العقار"></textarea>

  <input id="image" type="file" accept="image/*">

  <button class="publish-btn" onclick="addProperty()">
    نشر الإعلان
  </button>

</div>

<h2 style="text-align:center;margin:25px 0 10px">📍 خريطة حلب العقارية</h2><div id="map"></div>
<section class="search">

  <input
    id="searchInput"
    type="text"
    placeholder="ابحث عن عقار..."
    onkeyup="searchProperties()"
  >

  <select id="searchType" onchange="searchProperties()">
    <option value="">كل العقارات</option>
    <option>منزل</option>
    <option>شقة</option>
    <option>أرض</option>
    <option>مزرعة</option>
    <option>محل</option>
    <option>مكتب</option>
  </select>

</section>

<div class="container">

  <h2 class="title">🏠 أحدث العقارات</h2>

  <div class="cards" id="propertyList">

    <div class="empty">
      لا توجد إعلانات مضافة حالياً
    </div>

  </div>

</div>

<footer>

  <h3>عقارات الظاظا</h3>

  <p>بيع • شراء • إيجار</p>

  <p>حلب والمناطق المحيطة</p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const SUPABASE_URL = "https://kypzypsonkzfrhpldtmp.supabase.co";
const SUPABASE_KEY = "sb_publishable_9QRajsRSbCM2ee5nEphoAg_xmRUQR2-";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let properties = [];
let editingId = null;
const areaCoords = {"سيف الدولة":[36.1967,37.1438],"الأعظمية":[36.1918,37.1455],"الحمدانية":[36.165,37.115],"الجميلية":[36.205,37.157],"الزهراء":[36.232,37.166],"الفرقان":[36.218,37.145],"الموكامبو":[36.218,37.174],"الشهباء":[36.24,37.18],"ريف حلب":[36.25,37.1]};
const map=L.map("map").setView([36.2021,37.1343],12); L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap"}).addTo(map); let markers=[];


function openForm() {

  const form = document.getElementById("formBox");

  form.style.display =
    form.style.display === "block"
      ? "none"
      : "block";

  form.scrollIntoView({
    behavior: "smooth"
  });
}


/* تحميل الإعلانات المحفوظة */

async function loadProperties() {

  const { data, error } =
    await supabaseClient
      .from("properties")
      .select("*")
      .order("created_at", {
        ascending: false
      });

  if (error) {

    console.error(error);

    alert("حدث خطأ أثناء تحميل الإعلانات");

    return;
  }

  properties = data || [];

  displayProperties(properties); drawMarkers(properties);
}


/* إضافة إعلان */

async function addProperty() {

  const title =
    document.getElementById("title").value.trim();

  const type =
    document.getElementById("type").value;

  const area =
    document.getElementById("area").value;

  const price =
    document.getElementById("price").value.trim();

  const size =
    document.getElementById("size").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const description =
    document.getElementById("description").value.trim();

  const imageInput =
    document.getElementById("image");


  if (!title || !type || !area || !price || !phone) {

    alert(
      "يرجى تعبئة عنوان العقار والنوع والمنطقة والسعر ورقم التواصل"
    );

    return;
  }


  if (imageInput.files.length > 0) {

    const reader = new FileReader();

    reader.onload = async function(event) {

      await createProperty(
        event.target.result,
        title,
        type,
        area,
        price,
        size,
        phone,
        description
      );

    };

    reader.readAsDataURL(
      imageInput.files[0]
    );

  } else {

    await createProperty(
      "",
      title,
      type,
      area,
      price,
      size,
      phone,
      description
    );

  }

}


/* حفظ الإعلان في Supabase */

async function createProperty(
  image,
  title,
  type,
  area,
  price,
  size,
  phone,
  description
) {

  let result;
  if (editingId) {
    const old = properties.find(p => p.id === editingId);
    result = await supabaseClient.from("properties").update({title,type,area,price,size,phone,description,image:image || old?.image || ""}).eq("id",editingId).select().single();
  } else {
    result = await supabaseClient.from("properties").insert([{title,type,area,price,size,phone,description,image}]).select().single();
  }
  const data=result.data, error=result.error;


  if (error) {

    console.error(error);

    alert(
      "ما قدرنا نحفظ الإعلان. تأكد من الاتصال بالإنترنت."
    );

    return;
  }


  if(editingId){ properties=properties.map(p=>p.id===editingId?data:p); editingId=null; } else properties.unshift(data);

  displayProperties(properties);


  document.getElementById("formBox").style.display =
    "none";


  document.getElementById("title").value = "";
  document.getElementById("type").value = "";
  document.getElementById("area").value = "";
  document.getElementById("price").value = "";
  document.getElementById("size").value = "";
  document.getElementById("phone").value = "";
  document.getElementById("description").value = "";
  document.getElementById("image").value = "";


  displayProperties(properties); drawMarkers(properties); clearForm();
  alert("تم حفظ الإعلان بنجاح ✅");

}


/* عرض الإعلانات */

function clearForm(){["title","price","size","phone","description"].forEach(id=>document.getElementById(id).value="");document.getElementById("type").value="";document.getElementById("area").value="";document.getElementById("image").value="";}
function editProperty(id){const p=properties.find(x=>x.id===id);if(!p)return;editingId=id;document.getElementById("formBox").style.display="block";["title","price","size","phone","description"].forEach(k=>document.getElementById(k).value=p[k]||"");document.getElementById("type").value=p.type||"";document.getElementById("area").value=p.area||"";document.getElementById("formBox").scrollIntoView({behavior:"smooth"});}
async function deleteProperty(id){if(!confirm("هل أنت متأكد من حذف هذا الإعلان؟"))return;const {error}=await supabaseClient.from("properties").delete().eq("id",id);if(error){alert("تعذر حذف الإعلان. قد تكون صلاحية الحذف غير مفعلة.");return}properties=properties.filter(p=>p.id!==id);displayProperties(properties);drawMarkers(properties);}
function drawMarkers(list){markers.forEach(m=>map.removeLayer(m));markers=[];list.forEach(p=>{const pos=areaCoords[p.area];if(pos){const m=L.marker(pos).addTo(map).bindPopup("<b>"+String(p.title||"").replace(/</g,"&lt;")+"</b><br>📍 "+String(p.area||"").replace(/</g,"&lt;"));markers.push(m)}})}
function displayProperties(list) {

  const container =
    document.getElementById("propertyList");


  if (!list.length) {

    container.innerHTML =
      '<div class="empty">لا توجد إعلانات</div>';

    return;
  }


  container.innerHTML = "";


  list.forEach(function(property) {

    const card =
      document.createElement("div");

    card.className = "card";


    let imageHTML = "";


    if (property.image) {

      imageHTML =
        '<img class="card-image" src="' +
        property.image +
        '" alt="صورة العقار">';

    } else {

      imageHTML =
        '<div class="card-image" style="display:flex;align-items:center;justify-content:center;font-size:55px;">🏠</div>';

    }


    const whatsappNumber =
      String(property.phone || "")
        .replace(/^0+/, "963");


    card.innerHTML =

      imageHTML +

      '<div class="card-content">' +

      '<h3>' +
      property.title +
      '</h3>' +

      '<p>🏷️ النوع: ' +
      property.type +
      '</p>' +

      '<p>📍 المنطقة: ' +
      property.area +
      '</p>' +

      '<p>💰 السعر: ' +
      property.price +
      '</p>' +

      '<p>📐 المساحة: ' +
      (property.size || "غير محددة") +
      '</p>' +

      '<p>' +
      (property.description || "") +
      '</p>' +
      '<div class="actions">' +
      '<a class="contact" href="https://wa.me/' +
whatsappNumber +
'?text=' +
encodeURIComponent(
  'مرحباً، عم أتواصل معك بخصوص هذا العقار: ' +
  property.title +
  ' - ' +
  property.area +
  ' - السعر: ' +
  property.price
) +
'" target="_blank">' +

'📱 تواصل واتساب' +

'</a>' +

      '</div>';


    container.appendChild(card);

  });

}


/* البحث */

function searchProperties() {

  const text =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase();


  const type =
    document
      .getElementById("searchType")
      .value;


  const filtered =
    properties.filter(function(property) {

      const matchesText =

        String(property.title || "")
          .toLowerCase()
          .includes(text)

        ||

        String(property.area || "")
          .toLowerCase()
          .includes(text);


      const matchesType =
        !type ||
        property.type === type;


      return matchesText && matchesType;

    });


  displayProperties(filtered);

}


/* تشغيل تحميل الإعلانات عند فتح الموقع */

loadProperties();

  </script>

</body>
</html>
