<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عقارات الظاظا</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: #d4af37;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      font-size: 34px;
      margin-bottom: 8px;
    }

    header p {
      color: white;
      font-size: 16px;
    }

    .add-section {
      text-align: center;
      padding: 20px;
      background: white;
    }

    .add-btn {
      background: #d4af37;
      color: #111;
      border: none;
      padding: 14px 28px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .form-box {
      display: none;
      max-width: 700px;
      margin: 20px auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 15px #ccc;
    }

    .form-box h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #b28b18;
    }

    .form-box input,
    .form-box select,
    .form-box textarea {
      width: 100%;
      padding: 13px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .form-box textarea {
      height: 100px;
      resize: vertical;
    }

    .publish-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    .search {
      background: white;
      padding: 20px;
      text-align: center;
      box-shadow: 0 2px 8px #ccc;
    }

    .search input,
    .search select {
      padding: 12px;
      margin: 5px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .search button {
      padding: 12px 25px;
      border: none;
      border-radius: 8px;
      background: #d4af37;
      font-weight: bold;
      cursor: pointer;
    }

    .container {
      max-width: 1100px;
      margin: 25px auto;
      padding: 15px;
    }

    .title {
      text-align: center;
      margin-bottom: 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 12px #ccc;
    }

    .card-image {
      width: 100%;
      height: 190px;
      object-fit: cover;
      background: #ddd;
    }

    .card-content {
      padding: 15px;
    }

    .card h3 {
      color: #b28b18;
      margin-bottom: 10px;
    }

    .card p {
      margin: 7px 0;
    }

    .contact {
      display: block;
      margin-top: 15px;
      text-align: center;
      padding: 11px;
      background: #111;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    footer {
      margin-top: 40px;
      background: #111;
      color: white;
      text-align: center;
      padding: 25px;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #777;
    }
  </style>
</head>

<body>

<header>
  <h1>🏠 عقارات الظاظا</h1>
  <p>منصة عقارية للإعلانات في حلب</p>
</header>

<div class="add-section">
  <button class="add-btn" onclick="openForm()">
    ➕ إضافة إعلان
  </button>
</div>

<div class="form-box" id="formBox">

  <h2>إضافة إعلان عقاري</h2>

  <input id="title" type="text" placeholder="عنوان العقار">

  <select id="type">
    <option value="">نوع العقار</option>
    <option>منزل</option>
    <option>شقة</option>
    <option>أرض</option>
    <option>مزرعة</option>
    <option>محل</option>
    <option>مكتب</option>
  </select>

  <select id="area">
    <option value="">المنطقة</option>
    <option>سيف الدولة</option>
    <option>الأعظمية</option>
    <option>الحمدانية</option>
    <option>الجميلية</option>
    <option>الزهراء</option>
    <option>الفرقان</option>
    <option>الموكامبو</option>
    <option>الشهباء</option>
    <option>ريف حلب</option>
    <option>منطقة أخرى</option>
  </select>

  <input id="price" type="text" placeholder="السعر">

  <input id="size" type="text" placeholder="المساحة بالمتر">

  <input id="phone" type="text" placeholder="رقم التواصل">

  <textarea id="description" placeholder="اكتب تفاصيل العقار"></textarea>

  <input id="image" type="file" accept="image/*">

  <button class="publish-btn" onclick="addProperty()">
    نشر الإعلان
  </button>

</div>

<section class="search">

  <input
    id="searchInput"
    type="text"
    placeholder="ابحث عن عقار..."
    onkeyup="searchProperties()"
  >

  <select id="searchType" onchange="searchProperties()">
    <option value="">كل العقارات</option>
    <option>منزل</option>
    <option>شقة</option>
    <option>أرض</option>
    <option>مزرعة</option>
    <option>محل</option>
    <option>مكتب</option>
  </select>

</section>

<div class="container">

  <h2 class="title">🏠 أحدث العقارات</h2>

  <div class="cards" id="propertyList">

    <div class="empty">
      لا توجد إعلانات مضافة حالياً
    </div>

  </div>

</div>

<footer>

  <h3>عقارات الظاظا</h3>

  <p>بيع • شراء • إيجار</p>

  <p>حلب والمناطق المحيطة</p>

</footer>

<script>

let properties = [];

function openForm() {

  const form = document.getElementById("formBox");

  form.style.display =
    form.style.display === "block"
      ? "none"
      : "block";

  form.scrollIntoView({
    behavior: "smooth"
  });
}

function addProperty() {

  const title =
    document.getElementById("title").value;

  const type =
    document.getElementById("type").value;

  const area =
    document.getElementById("area").value;

  const price =
    document.getElementById("price").value;

  const size =
    document.getElementById("size").value;

  const phone =
    document.getElementById("phone").value;

  const description =
    document.getElementById("description").value;

  const imageInput =
    document.getElementById("image");

  if (!title || !type || !area || !price || !phone) {

    alert("يرجى تعبئة عنوان العقار والنوع والمنطقة والسعر ورقم التواصل");

    return;
  }

  if (imageInput.files.length > 0) {

    const reader = new FileReader();

    reader.onload = function(event) {

      createProperty(
        event.target.result,
        title,
        type,
        area,
        price,
        size,
        phone,
        description
      );

    };

    reader.readAsDataURL(imageInput.files[0]);

  } else {

    createProperty(
      "",
      title,
      type,
      area,
      price,
      size,
      phone,
      description
    );

  }

}

function createProperty(
  image,
  title,
  type,
  area,
  price,
  size,
  phone,
  description
) {

  const property = {

    image,
    title,
    type,
    area,
    price,
    size,
    phone,
    description

  };

  properties.unshift(property);

  displayProperties(properties);

  document.getElementById("formBox").style.display = "none";

  document.getElementById("title").value = "";
  document.getElementById("type").value = "";
  document.getElementById("area").value = "";
  document.getElementById("price").value = "";
  document.getElementById("size").value = "";
  document.getElementById("phone").value = "";
  document.getElementById("description").value = "";
  document.getElementById("image").value = "";

  alert("تمت إضافة الإعلان بنجاح");

}

function displayProperties(list) {

  const container =
    document.getElementById("propertyList");

  if (list.length === 0) {

    container.innerHTML =
      '<div class="empty">لا توجد إعلانات</div>';

    return;
  }

  container.innerHTML = "";

  list.forEach(function(property) {

    const card =
      document.createElement("div");

    card.className = "card";

    let imageHTML = "";

    if (property.image) {

      imageHTML =
        '<img class="card-image" src="' +
        property.image +
        '" alt="صورة العقار">';

    } else {

      imageHTML =
        '<div class="card-image" style="display:flex;align-items:center;justify-content:center;font-size:55px;">🏠</div>';

    }

    const whatsappNumber =
      property.phone.replace(/^0+/, "963");

    card.innerHTML =

      imageHTML +

      '<div class="card-content">' +

      '<h3>' +
      property.title +
      '</h3>' +

      '<p>🏷️ النوع: ' +
      property.type +
      '</p>' +

      '<p>📍 المنطقة: ' +
      property.area +
      '</p>' +

      '<p>💰 السعر: ' +
      property.price +
      '</p>' +

      '<p>📐 المساحة: ' +
      (property.size || "غير محددة") +
      '</p>' +

      '<p>' +
      (property.description || "") +
      '</p>' +

      '<a class="contact" href="https://wa.me/' +
      whatsappNumber +
      '" target="_blank">' +

      '📱 تواصل واتساب' +

      '</a>' +

      '</div>';

    container.appendChild(card);

  });

}

function searchProperties() {

  const text =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase();

  const type =
    document
      .getElementById("searchType")
      .value;

  const filtered =
    properties.filter(function(property) {

      const matchesText =
        property.title
          .toLowerCase()
          .includes(text) ||

        property.area
          .toLowerCase()
          .includes(text);

      const matchesType =
        !type ||
        property.type === type;

      return matchesText && matchesType;

    });

  displayProperties(filtered);

}

</script>

</body>
</html>
